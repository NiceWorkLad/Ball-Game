<!DOCTYPE html>
<html lang="en" data-theme="sunset">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF7E5F">
  <title>Keep Up!</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oi&family=Fredoka:wght@600&family=Audiowide&family=Caveat:wght@700&family=Alfa+Slab+One&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Icons: Lucide (https://lucide.dev), ISC licence, see icons/LICENSE-lucide.txt -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24">
      <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
      <path d="M16 9a5 5 0 0 1 0 6" />
      <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
    </symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24">
      <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
      <line x1="22" x2="16" y1="9" y2="15" />
      <line x1="16" x2="22" y1="9" y2="15" />
    </symbol>
  </svg>
  <div class="container">
    <div id="canvas-box">
      <h1 id="score">0</h1>
      <canvas id="game-screen" class="dark-shadow"></canvas>
      <div id="overlay" class="overlay" aria-live="polite">
        <h2 id="overlay-title">KEEP UP!</h2>
        <p id="overlay-score"></p>
        <p id="overlay-hint">Tap to start</p>
      </div>

      <!-- Settings: just an icon in the top-right corner of the board (start and game over screens) -->
      <button id="open-settings" class="icon-button corner-button" type="button" aria-label="Settings" title="Settings" data-ui>
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
      </button>

      <div id="settings" class="settings" data-ui hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-head">
          <h2 id="settings-title">SETTINGS</h2>
          <button id="close-settings" class="icon-button" type="button" aria-label="Close settings" title="Close">
            <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>

        <section class="setting">
          <p class="setting-label">Sound</p>
          <div class="sound-row">
            <button id="sound-toggle" class="pill toggle" type="button" aria-pressed="true" aria-label="Sound">
              <svg class="icon" aria-hidden="true"><use href="#i-sound-on"></use></svg><span>On</span>
            </button>
            <input id="volume" type="range" min="0" max="100" step="5" aria-label="Volume">
          </div>
        </section>

        <section class="setting">
          <p class="setting-label" id="size-label">Ball size</p>
          <div id="size-list" class="choices sizes" role="radiogroup" aria-labelledby="size-label"></div>
        </section>

        <section class="setting">
          <p class="setting-label" id="font-label">Font <span id="font-name"></span></p>
          <div id="font-list" class="choices" role="radiogroup" aria-labelledby="font-label"></div>
        </section>

        <section class="setting">
          <p class="setting-label" id="theme-label">Theme <span id="theme-name"></span></p>
          <div id="theme-list" class="choices" role="radiogroup" aria-labelledby="theme-label"></div>
        </section>
      </div>
    </div>
    <h2 id="high-score">BEST 0</h2>
  </div>
  <div class="cursor-dot"></div>
  <script src="script.js"></script>
</body>
</html>
