<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF7E5F">
  <title>Keep Up!</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oi&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div id="canvas-box">
      <h1 id="score">0</h1>
      <canvas id="game-screen" class="dark-shadow"></canvas>
      <div id="overlay" class="overlay" aria-live="polite">
        <h2 id="overlay-title">KEEP UP!</h2>
        <p id="overlay-score"></p>
        <p id="overlay-hint">Tap to start</p>
      </div>
    </div>
    <h2 id="high-score">BEST 0</h2>
  </div>
  <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">&#128266;</button>
  <div class="cursor-outline"></div>
  <div class="cursor-dot"></div>
  <script src="script.js"></script>
</body>
</html>
